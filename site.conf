# Settings for the generated root files. Shell syntax: KEY="value", no spaces around "=".
# Set them with `make configure KEY=value ...` or edit this file. `make build` reads it.

# GitHub account this configuration belongs to. CI refuses to publish when the repository
# owner differs, so a fresh fork cannot go live with someone else's contacts.
OWNER="sarathsp06"

# Where the site is served, without a trailing slash. Empty means https://<OWNER>.github.io.
SITE_URL=""

# Security contacts (RFC 9116), most preferred first: email addresses and/or https URLs
# (a form, a GitHub private advisory link). At least one is required.
SECURITY_CONTACTS="mailto:sarath.sp06@gmail.com"

# Optional: page describing your vulnerability disclosure policy.
SECURITY_POLICY=""

# Optional: page thanking reporters.
SECURITY_ACKNOWLEDGMENTS=""

# Optional: https URL of your OpenPGP public key for encrypted reports.
SECURITY_ENCRYPTION=""

# Optional: extra comment lines at the top of security.txt, separated by ";".
# Handy for pointing reporters at per-project channels.
SECURITY_NOTES="Please name the project and version affected in your report.;Projects with GitHub private vulnerability reporting enabled also accept reports at https://github.com/sarathsp06/PROJECT/security/advisories/new"

# Languages reports may be written in, comma separated (RFC 5646 tags).
PREFERRED_LANGUAGES="en"

# security.txt expires this many days after each build. RFC 9116 recommends less than
# a year; CI rebuilds monthly, so the file never gets close to expiring.
EXPIRES_DAYS="180"

# Sitemaps of your project sites, space separated. Listed in robots.txt and gathered into
# a root /sitemap.xml index (sitemaps.org).
SITEMAPS="https://sarathsp06.github.io/sparrow/sitemap-index.xml https://sarathsp06.github.io/testhooks/sitemap-index.xml"

# Optional root /llms.txt (llmstxt.org): a title, a one-line summary and one project per
# line as "Name | URL | description". Empty PROJECTS means no llms.txt. Point the URL at a
# project's own llms.txt when it has one.
SITE_TITLE="sarathsp06's projects"
SITE_DESCRIPTION="Open-source tools by Sarath Sadasivan Pillai, each documented on its own site under this origin."
PROJECTS="
Sparrow | https://sarathsp06.github.io/sparrow/llms.txt | Self-hosted webhook delivery server
Testhooks | https://sarathsp06.github.io/testhooks/ | Self-hosted webhook inspector
Herdr Web | https://sarathsp06.github.io/herdrweb/ | The inbox for your coding agents
JanusFS | https://sarathsp06.github.io/janusfs/ | A policy-enforcing filesystem for AI agents
Exomlgen | https://sarathsp06.github.io/exomlgen/ |
"
